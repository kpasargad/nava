name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Tests/Nava.Tests.csproj -c Release
      - name: Regression checks
        run: dotnet run --project Tests/Nava.Tests.csproj -c Release --no-build
      - name: Detached window and character checks
        run: dotnet run --project Tests/Nava.Tests.csproj -c Release --no-build -- --visual-smoke "$env:RUNNER_TEMP\nava-previews"
      - name: Native Alt+Tab window policy
        run: dotnet run --project Tests/Nava.Tests.csproj -c Release --no-build -- --shell-window-smoke .
